<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Radio Escoba – DJ Bruji & DJ Khalessi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #0b0914;            /* Fondo negro místico */
    --card: #161224;          /* Tarjeta oscura */
    --text: #f1f1f6;          /* Texto blanco suave */
    --soft-shadow: #201a35;   /* Sombra luz */
    --hard-shadow: #06050b;   /* Sombra profunda */
    --accent-purple: #a855f7; /* Morado Neón */
    --accent-green: #39ff14;  /* Verde Neón */
  }

  /* Reset adaptado para incrustar en Weebly */
  *{box-sizing:border-box}
  html, body{
    margin:0;
    padding:0;
    width: 100%;
    background: transparent; /* Permite integrarse en la web */
    font-family:"Poppins", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    color:var(--text);
  }

  /* Contenedor adaptativo al ancho de la columna de Weebly */
  .wrap{
    width: 100%;
    max-width: 100%;
    margin: 0 auto;
  }

  /* Tarjeta compacta */
  .card{
    background:var(--card);
    border-radius:20px;
    padding:18px;
    border: 1px solid rgba(168, 85, 247, 0.2);
    box-shadow:
      -8px -8px 20px var(--soft-shadow),
      8px 8px 20px var(--hard-shadow),
      0 0 20px rgba(168, 85, 247, 0.12);
  }

  .top{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:12px;
  }
  
  /* Carátula */
  #album-art {
    width: 60px;
    height: 60px;
    border-radius: 12px;
    object-fit: cover;
    background-color: var(--bg);
    border: 2px solid var(--accent-green);
    box-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
    flex-shrink: 0;
  }

  .top-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .live{
    display:inline-flex; align-items:center; gap:6px;
    padding:3px 10px;
    border-radius:999px;
    background: #100b1e;
    border: 1px solid var(--accent-green);
    color: var(--accent-green);
    font-size:.75rem; font-weight:700;
    width: fit-content;
    box-shadow: 0 0 8px rgba(57, 255, 20, 0.2);
  }
  .live-dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--accent-green);
    box-shadow:0 0 8px var(--accent-green);
    animation:pulse 1.6s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(57, 255, 20, 0.8)}
    70%{box-shadow:0 0 0 8px rgba(57, 255, 20, 0)}
    100%{box-shadow:0 0 0 0 rgba(57, 255, 20, 0)}
  }

  .title{
    font-weight:700; font-size:1.15rem; letter-spacing:.3px;
    color: var(--accent-purple);
    text-shadow: 0 0 8px rgba(168, 85, 247, 0.4);
    line-height: 1.2;
  }

  .subtitle{
    font-size:.78rem; color: #a19db5;
  }

  /* Contenedor reproductor compacto */
  .player-shell{
    margin-top:12px;
    border-radius:14px;
    padding:10px;
    background:#100c1b;
    border: 1px solid rgba(57, 255, 20, 0.2);
    box-shadow:
      inset -5px -5px 10px var(--soft-shadow),
      inset 5px 5px 10px var(--hard-shadow);
  }

  audio {
    width: 100%;
    height: 38px;
    outline: none;
    border-radius: 8px;
  }

  /* Status compacto */
  .now-playing{
    margin-top:12px;
    padding:10px 14px;
    border-radius:12px;
    background:var(--card);
    border: 1px solid rgba(168, 85, 247, 0.2);
    box-shadow:
      -5px -5px 10px var(--soft-shadow),
      5px 5px 10px var(--hard-shadow);
    text-align: center;
  }
  
  .song {
    font-size: .85rem;
    font-weight: 600;
    color: var(--accent-green);
  }

  /* Botones reducidos */
  .actions{
    margin-top:12px; display:flex; gap:8px;
  }
  .btn{
    flex: 1;
    appearance:none; border:1px solid rgba(168, 85, 247, 0.3); cursor:pointer;
    padding:8px 10px; border-radius:10px;
    background:var(--card); color:var(--text); font-weight:600;
    font-size: .8rem;
    box-shadow:
      -4px -4px 8px var(--soft-shadow),
      4px 4px 8px var(--hard-shadow);
    transition: all .2s ease;
  }
  .btn:hover{
    border-color: var(--accent-green);
    color: var(--accent-green);
    box-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
  }
  .btn:active{
    transform: translateY(1px);
    box-shadow:
      inset -4px -4px 8px var(--soft-shadow),
      inset 4px 4px 8px var(--hard-shadow);
  }
</style>
</head>
<body>

  <main class="wrap">
    <section class="card" aria-label="Reproductor de radio">
      <div class="top">
        <img id="album-art" src="https://i.postimg.cc/y69049Tj/logo.jpg" alt="Radio Escoba - DJ Bruji & DJ Khalessi">
        
        <div class="top-info">
          <span class="live"><span class="live-dot"></span> EN VIVO</span>
          <div class="title">Radio Escoba</div>
          <div class="subtitle">DJ Bruji & DJ Khalessi</div>
        </div>
      </div>

      <div class="player-shell">
        <audio id="radio-player" controls preload="none">
          <source src="https://app.sonicpanelradio.com/8126/stream" type="audio/mpeg">
          Tu navegador no soporta el elemento de audio.
        </audio>
      </div>

      <div class="now-playing" aria-live="polite">
        <div class="song">Sintonizando En Vivo 24/7</div>
      </div>

      <div class="actions">
        <button class="btn" onclick="reloadStream()">Recargar</button>
        <button class="btn" onclick="window.open('https://app.sonicpanelradio.com/8126/stream', '_blank')">Stream Directo</button>
      </div>
    </section>
  </main>

  <script>
    function reloadStream() {
      const player = document.getElementById('radio-player');
      player.src = "https://app.sonicpanelradio.com/8126/stream?" + new Date().getTime();
      player.load();
      player.play();
    }
  </script>

</body>
</html>
